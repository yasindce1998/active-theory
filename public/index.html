<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23bee6ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23bee6ff'/%3E%3C/svg%3E">
    <meta name="description" content="A cinematic real-time WebGL sci-fi experience: GPU fluids, particles, lens effects and generative sound.">
    <title>Lumen — Signal from the deep</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cinematic.css">
    <link rel="modulepreload" href="/js/main.js">
</head>
<body>
    <canvas id="gl" aria-hidden="true"></canvas>

    <div class="bar bar-top" aria-hidden="true"></div>
    <div class="bar bar-bottom" aria-hidden="true"></div>

    <div id="enter" class="enter" role="dialog" aria-labelledby="enter-title">
        <div class="enter-inner">
            <p class="enter-meta" data-decode="TRANSMISSION 0x4C55 // ORIGIN UNKNOWN"></p>
            <h1 id="enter-title" class="enter-title" data-decode="LUMEN"></h1>
            <p class="enter-meta dim" data-decode="BEST EXPERIENCED WITH HEADPHONES"></p>
            <div class="enter-actions">
                <button id="enter-sound" class="pill pill-primary" type="button" data-magnetic>Enter with sound</button>
                <button id="enter-silent" class="pill" type="button" data-magnetic>Enter silently</button>
            </div>
        </div>
    </div>

    <header class="top">
        <a class="logo" href="/" aria-label="Lumen home">Lumen</a>
        <nav id="nav" aria-label="Sections"></nav>
        <div class="controls">
            <button id="sound" class="pill" type="button" aria-pressed="false" data-magnetic>
                <i class="bars" aria-hidden="true"><b></b><b></b><b></b></i><span>Audio off</span>
            </button>
            <button id="gui-toggle" class="pill" type="button" aria-label="Open parameter panel (G)" data-magnetic>G</button>
        </div>
    </header>

    <div class="hud" aria-hidden="true">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <div class="hud-block hud-left">
            <span class="rec"><i></i>REC</span>
            <span id="hud-tc">00:00:00:00</span>
            <span id="hud-seq"></span>
        </div>
        <div class="hud-block hud-right">
            <span>CAM <b id="hud-cam">0 0 0</b></span>
            <span>FOV <b id="hud-fov">0</b></span>
            <span>FOC <b id="hud-focus">0</b></span>
            <span>WRP <b id="hud-warp">0</b></span>
            <span>FPS <b id="hud-fps">0</b></span>
        </div>
    </div>

    <div id="reticle" aria-hidden="true">
        <svg viewBox="-60 -60 120 120" width="120" height="120">
            <circle r="44" fill="none" stroke="currentColor" stroke-width="0.75" stroke-dasharray="2 6" />
            <path d="M-52 0h12M40 0h12M0 -52v12M0 40v12" stroke="currentColor" stroke-width="1" />
            <path d="M-30 -36h-6v6M30 -36h6v6M-30 36h-6v-6M30 36h6v-6" fill="none" stroke="currentColor" stroke-width="1" />
        </svg>
        <span id="reticle-range">RNG 0</span>
    </div>

    <main id="content"></main>

    <div class="progress-track" aria-hidden="true"><div id="progress"></div></div>
    <p class="hint" aria-hidden="true">Scroll · Move · Press G</p>
    <div id="cursor" aria-hidden="true"></div>

    <div class="fallback">
        <h1>Lumen</h1>
        <p>This experience needs WebGL 2 with float render targets. Try a recent version of Chrome, Firefox, Safari or Edge.</p>
    </div>

    <noscript><style>.enter{display:none}</style><p class="noscript">This site needs JavaScript.</p></noscript>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
